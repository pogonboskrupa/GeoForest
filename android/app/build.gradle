plugins {
    id 'com.android.application'
}

android {
    namespace 'ba.spd.geoforest'
    compileSdk 34

    defaultConfig {
        applicationId "ba.spd.geoforest"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Jedan stalni ključ (geoforest-release.keystore, van repoa) za SVE APK-ove koje CI objavljuje.
    // Android dozvoljava update preko instalirane app SAMO uz isti potpis — bez stalnog ključa
    // svaki CI build ima nasumičan debug ključ i "Ažuriraj aplikaciju" pada na "App not installed".
    // Lokalno bez GEOFOREST_KEYSTORE: debug build koristi AGP debug ključ te mašine.
    def geoStore = System.getenv('GEOFOREST_KEYSTORE')
    signingConfigs {
        geoforest {
            if (geoStore) {
                storeFile file(geoStore)
                storePassword System.getenv('GEOFOREST_STORE_PASSWORD')
                keyAlias System.getenv('GEOFOREST_KEY_ALIAS')
                keyPassword System.getenv('GEOFOREST_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (geoStore) signingConfig signingConfigs.geoforest
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (geoStore) signingConfig signingConfigs.geoforest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    aaptOptions {
        noCompress "html", "js", "css", "json", "png", "svg", "kml", "geojson", "wasm"
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation('androidx.core:core:1.12.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.appcompat:appcompat:1.6.1') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.webkit:webkit:1.10.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// Nikad ne prijavi nepotpisan release kao spreman APK za korisnika.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }) {
        ['GEOFOREST_KEYSTORE', 'GEOFOREST_STORE_PASSWORD', 'GEOFOREST_KEY_ALIAS', 'GEOFOREST_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Nedostaje release konfiguracija: " + it)
        }
    }
}
